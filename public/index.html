<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FedEx Checker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 22px; font-weight: 700; color: #f78166; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #8b949e; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .field label {
      display: block; font-size: 12px; font-weight: 600; color: #8b949e;
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .field textarea {
      width: 100%; height: 180px; padding: 12px; background: #161b22;
      border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9;
      font-size: 13px; font-family: 'SF Mono', 'Consolas', monospace;
      resize: vertical; outline: none; transition: border-color 0.2s;
    }
    .field textarea:focus { border-color: #f78166; }
    .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
    button {
      padding: 10px 24px; background: #f78166; color: #0d1117;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.stop { background: #da3633; color: #fff; }
    .stats { display: flex; gap: 16px; font-size: 13px; }
    .stat { padding: 6px 14px; border-radius: 6px; font-weight: 600; }
    .stat.success { background: #1a3a2a; color: #3fb950; }
    .stat.dead { background: #3a1a1a; color: #f85149; }
    .stat.progress { background: #1a2a3a; color: #58a6ff; }
    .results { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
    .panel-header {
      padding: 10px 14px; font-size: 13px; font-weight: 600;
      border-bottom: 1px solid #30363d; display: flex; justify-content: space-between;
    }
    .panel-header.live { color: #3fb950; }
    .panel-header.dead { color: #f85149; }
    .panel-body { max-height: 400px; overflow-y: auto; padding: 8px; }
    .row {
      display: flex; align-items: center; padding: 6px 8px;
      border-radius: 4px; font-size: 12px; font-family: 'SF Mono', 'Consolas', monospace;
      gap: 8px; margin-bottom: 2px;
    }
    .row.live { background: #1a3a2a; }
    .row.dead { background: #3a1a1a; }
    .row .user { color: #c9d1d9; font-weight: 600; min-width: 100px; }
    .row .pass { color: #8b949e; }
    .row .proxy { color: #58a6ff; margin-left: auto; font-size: 11px; }
    .empty { text-align: center; padding: 30px; color: #484f58; font-size: 13px; }
    .progress-bar { height: 3px; background: #30363d; border-radius: 2px; margin-bottom: 16px; overflow: hidden; }
    .progress-fill { height: 100%; background: #f78166; transition: width 0.3s; width: 0%; }
  </style>
</head>
<body>
  <div class="container">
    <h1>FedEx Account Checker</h1>
    <p class="sub">Paste user:pass list and proxies, click Start</p>

    <div class="grid">
      <div class="field">
        <label>Accounts (user:pass)</label>
        <textarea id="accounts" placeholder="user1:pass1&#10;user2:pass2&#10;user3:pass3"></textarea>
      </div>
      <div class="field">
        <label>Proxies (IP:port) — optional</label>
        <textarea id="proxies" placeholder="127.0.0.1:8080&#10;192.168.1.1:3128"></textarea>
      </div>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="controls">
      <button id="startBtn" onclick="startCheck()">Start Check</button>
      <button id="stopBtn" class="stop" onclick="stopCheck()" style="display:none">Stop</button>
      <div class="stats">
        <span class="stat progress" id="statProgress" style="display:none">0/0</span>
        <span class="stat success" id="statSuccess" style="display:none">Live: 0</span>
        <span class="stat dead" id="statDead" style="display:none">Dead: 0</span>
      </div>
    </div>

    <div class="results">
      <div class="panel">
        <div class="panel-header live">LIVE <span id="liveCount">0</span></div>
        <div class="panel-body" id="liveList"><div class="empty">Waiting...</div></div>
      </div>
      <div class="panel">
        <div class="panel-header dead">DEAD <span id="deadCount">0</span></div>
        <div class="panel-body" id="deadList"><div class="empty">Waiting...</div></div>
      </div>
    </div>
  </div>

  <script>
    var liveCount = 0, deadCount = 0, total = 0, checked = 0;
    var abortController = null;

    function startCheck() {
      var rawAccounts = document.getElementById('accounts').value.trim();
      var rawProxies = document.getElementById('proxies').value.trim();
      if (!rawAccounts) return alert('Please paste accounts (user:pass)');

      var accounts = rawAccounts.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l && l.indexOf(':') !== -1; });
      var proxies = rawProxies ? rawProxies.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l; }) : [];
      if (!accounts.length) return alert('No valid accounts found');

      liveCount = 0; deadCount = 0; total = accounts.length; checked = 0;
      document.getElementById('liveList').innerHTML = '';
      document.getElementById('deadList').innerHTML = '';
      document.getElementById('liveCount').textContent = '0';
      document.getElementById('deadCount').textContent = '0';
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').style.display = '';
      document.getElementById('statProgress').style.display = '';
      document.getElementById('statSuccess').style.display = '';
      document.getElementById('statDead').style.display = '';
      updateStats();

      abortController = new AbortController();

      fetch('/api/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accounts: accounts, proxies: proxies }),
        signal: abortController.signal
      }).then(async function(res) {
        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var buffer = '';

        while (true) {
          var chunk = await reader.read();
          if (chunk.done) break;
          buffer += decoder.decode(chunk.value, { stream: true });
          var parts = buffer.split('\n\n');
          buffer = parts.pop();
          for (var i = 0; i < parts.length; i++) {
            var line = parts[i];
            if (line.indexOf('data: ') === 0) {
              try {
                var data = JSON.parse(line.slice(6));
                if (data.type === 'progress') {
                  checked = data.index;
                  if (data.result === 'success') {
                    liveCount++;
                    addRow('live', data.entry);
                  } else {
                    deadCount++;
                    addRow('dead', data.entry);
                  }
                  updateStats();
                } else if (data.type === 'done') {
                  finishCheck();
                }
              } catch(e) {}
            }
          }
        }
        finishCheck();
      }).catch(function() { finishCheck(); });
    }

    function addRow(type, entry) {
      var list = document.getElementById(type === 'live' ? 'liveList' : 'deadList');
      var div = document.createElement('div');
      div.className = 'row ' + type;
      div.innerHTML = '<span class="user">' + esc(entry.user) + '</span><span class="pass">' + esc(entry.pass) + '</span><span class="proxy">' + esc(entry.proxy) + '</span>';
      list.appendChild(div);
      list.scrollTop = list.scrollHeight;
    }

    function updateStats() {
      document.getElementById('statProgress').textContent = checked + '/' + total;
      document.getElementById('statSuccess').textContent = 'Live: ' + liveCount;
      document.getElementById('statDead').textContent = 'Dead: ' + deadCount;
      document.getElementById('liveCount').textContent = liveCount;
      document.getElementById('deadCount').textContent = deadCount;
      document.getElementById('progressFill').style.width = total ? (checked / total * 100) + '%' : '0%';
    }

    function finishCheck() {
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').style.display = 'none';
      updateStats();
    }

    function stopCheck() {
      if (abortController) abortController.abort();
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').style.display = 'none';
      updateStats();
    }

    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
