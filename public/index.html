<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FedEx Checker v3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; padding: 16px; }
    .container { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 20px; font-weight: 700; color: #f78166; }
    .sub { font-size: 12px; color: #8b949e; margin-bottom: 12px; }
    .warn { color: #f85149; font-size: 11px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: #8b949e; margin-bottom: 4px; text-transform: uppercase; }
    .field textarea { width: 100%; height: 150px; padding: 10px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 12px; font-family: 'SF Mono', 'Consolas', monospace; resize: vertical; outline: none; }
    .field textarea:focus { border-color: #f78166; }
    .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    button { padding: 8px 18px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-start { background: #f78166; color: #0d1117; }
    .btn-stop { background: #da3633; color: #fff; }
    .btn-test { background: #30363d; color: #58a6ff; font-size: 11px; padding: 6px 12px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:hover:not(:disabled) { opacity: 0.85; }
    select { padding: 7px 10px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 12px; outline: none; }
    .stats { display: flex; gap: 10px; font-size: 12px; }
    .stat { padding: 5px 12px; border-radius: 5px; font-weight: 600; }
    .stat.live { background: #1a3a2a; color: #3fb950; }
    .stat.dead { background: #3a1a1a; color: #f85149; }
    .stat.prog { background: #1a2a3a; color: #58a6ff; }
    .stat.test { background: #2a2a1a; color: #d2991d; font-size: 11px; }
    .results { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .panel { background: #161b22; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; }
    .panel-h { padding: 8px 12px; font-size: 12px; font-weight: 600; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; }
    .panel-h.live { color: #3fb950; }
    .panel-h.dead { color: #f85149; }
    .panel-b { max-height: 300px; overflow-y: auto; padding: 6px; }
    .row { display: flex; align-items: center; padding: 5px 8px; border-radius: 4px; font-size: 11px; font-family: 'SF Mono', 'Consolas', monospace; gap: 6px; margin-bottom: 2px; flex-wrap: wrap; }
    .row.live { background: #1a3a2a; }
    .row.dead { background: #3a1a1a; }
    .row .u { color: #c9d1d9; font-weight: 600; min-width: 80px; }
    .row .p { color: #8b949e; }
    .row .px { color: #58a6ff; margin-left: auto; font-size: 10px; }
    .row .t { color: #484f58; font-size: 10px; }
    .row .err { font-size: 10px; color: #f85149; width: 100%; word-break: break-all; margin-top: 2px; }
    .empty { text-align: center; padding: 24px; color: #484f58; font-size: 12px; }
    .progress-bar { height: 3px; background: #30363d; border-radius: 2px; margin-bottom: 12px; overflow: hidden; }
    .progress-fill { height: 100%; background: #f78166; transition: width 0.3s; width: 0%; }
    .log-panel { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; }
    .log-panel .panel-h { color: #8b949e; }
    .log-panel .panel-b { max-height: 200px; font-size: 11px; font-family: 'SF Mono', 'Consolas', monospace; padding: 8px; }
    .log-line { padding: 2px 0; border-bottom: 1px solid #161b22; }
    .log-line .ts { color: #484f58; margin-right: 8px; }
    .log-line.LIVE { color: #3fb950; }
    .log-line.DEAD { color: #f85149; }
    .log-line.ERR { color: #f85149; }
    .log-line.INFO { color: #8b949e; }
  </style>
</head>
<body>
  <div class="container">
    <h1>FedEx Account Checker v3</h1>
    <p class="sub">Paste user:pass + proxies, set threads, click Start</p>
    <p class="warn">FedEx blocks datacenter IPs — proxies are REQUIRED</p>

    <div class="grid">
      <div class="field">
        <label>Accounts (user:pass)</label>
        <textarea id="accounts" placeholder="user1:pass1&#10;user2:pass2"></textarea>
      </div>
      <div class="field">
        <label>Proxies (IP:port)</label>
        <textarea id="proxies" placeholder="148.230.96.6:11854"></textarea>
      </div>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="controls">
      <button class="btn-start" id="startBtn" onclick="startCheck()">Start Check</button>
      <button class="btn-stop" id="stopBtn" onclick="stopCheck()" style="display:none">Stop</button>
      <button class="btn-test" id="testBtn" onclick="testProxies()">Test Proxies</button>
      <select id="threads">
        <option value="1">1 Thread</option>
        <option value="3">3 Threads</option>
        <option value="5" selected>5 Threads</option>
        <option value="7">7 Threads</option>
        <option value="10">10 Threads</option>
      </select>
      <div class="stats">
        <span class="stat prog" id="statProg" style="display:none">0/0</span>
        <span class="stat live" id="statLive" style="display:none">Live: 0</span>
        <span class="stat dead" id="statDead" style="display:none">Dead: 0</span>
        <span class="stat test" id="statTest" style="display:none"></span>
      </div>
    </div>

    <div class="results">
      <div class="panel">
        <div class="panel-h live">LIVE <span id="liveCount">0</span></div>
        <div class="panel-b" id="liveList"><div class="empty">-</div></div>
      </div>
      <div class="panel">
        <div class="panel-h dead">DEAD <span id="deadCount">0</span></div>
        <div class="panel-b" id="deadList"><div class="empty">-</div></div>
      </div>
    </div>

    <div class="log-panel">
      <div class="panel-h">LOGS</div>
      <div class="panel-b" id="logList"><div class="empty">Waiting for activity...</div></div>
    </div>
  </div>

  <script>
    var liveCount = 0, deadCount = 0, total = 0, checked = 0;
    var abortController = null;

    function addLog(level, msg) {
      var list = document.getElementById('logList');
      if (list.querySelector('.empty')) list.innerHTML = '';
      var div = document.createElement('div');
      div.className = 'log-line ' + level;
      var now = new Date();
      var ts = now.toTimeString().split(' ')[0];
      div.innerHTML = '<span class="ts">' + ts + '</span>' + esc(msg);
      list.appendChild(div);
      list.scrollTop = list.scrollHeight;
    }

    function testProxies() {
      var raw = document.getElementById('proxies').value.trim();
      if (!raw) return alert('No proxies to test');
      var proxies = raw.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l; });
      var btn = document.getElementById('testBtn');
      btn.disabled = true;
      btn.textContent = 'Testing...';
      var stat = document.getElementById('statTest');
      stat.style.display = '';
      stat.textContent = 'Testing 0/' + proxies.length;

      var alive = 0, dead = 0, done = 0;
      addLog('INFO', 'Testing ' + proxies.length + ' proxies...');

      proxies.forEach(function(px) {
        fetch('/api/test-proxy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ proxy: px })
        }).then(function(r) { return r.json(); }).then(function(data) {
          done++;
          if (data.alive) { alive++; addLog('LIVE', 'Proxy ' + px + ' -> ALIVE (' + data.ip + ')'); }
          else { dead++; addLog('DEAD', 'Proxy ' + px + ' -> DEAD'); }
          stat.textContent = 'Live: ' + alive + ' Dead: ' + dead;
          if (done >= proxies.length) {
            btn.disabled = false;
            btn.textContent = 'Test Proxies';
            addLog('INFO', 'Proxy test done: ' + alive + ' alive, ' + dead + ' dead');
          }
        }).catch(function(e) {
          done++; dead++;
          addLog('ERR', 'Proxy ' + px + ' -> ERROR: ' + e.message);
          stat.textContent = 'Live: ' + alive + ' Dead: ' + dead;
          if (done >= proxies.length) { btn.disabled = false; btn.textContent = 'Test Proxies'; }
        });
      });
    }

    function startCheck() {
      var rawAccounts = document.getElementById('accounts').value.trim();
      var rawProxies = document.getElementById('proxies').value.trim();
      if (!rawAccounts) return alert('Please paste accounts');

      var accounts = rawAccounts.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l && l.indexOf(':') !== -1; });
      var proxies = rawProxies ? rawProxies.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l; }) : [];
      if (!accounts.length) return alert('No valid accounts');

      var threads = parseInt(document.getElementById('threads').value) || 5;

      liveCount = 0; deadCount = 0; total = accounts.length; checked = 0;
      document.getElementById('liveList').innerHTML = '';
      document.getElementById('deadList').innerHTML = '';
      document.getElementById('logList').innerHTML = '';
      document.getElementById('liveCount').textContent = '0';
      document.getElementById('deadCount').textContent = '0';
      document.getElementById('progressFill').style.width = '0%';
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').style.display = '';
      document.getElementById('statProg').style.display = '';
      document.getElementById('statLive').style.display = '';
      document.getElementById('statDead').style.display = '';
      updateStats();

      addLog('INFO', 'Starting: ' + total + ' accounts, ' + proxies.length + ' proxies, ' + threads + ' threads');

      abortController = new AbortController();

      fetch('/api/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accounts: accounts, proxies: proxies, threads: threads }),
        signal: abortController.signal
      }).then(async function(res) {
        var reader = res.body.getReader();
        var decoder = new TextDecoder();
        var buffer = '';

        while (true) {
          var chunk = await reader.read();
          if (chunk.done) break;
          buffer += decoder.decode(chunk.value, { stream: true });
          var parts = buffer.split('\n\n');
          buffer = parts.pop();
          for (var i = 0; i < parts.length; i++) {
            var line = parts[i];
            if (line.indexOf('data: ') === 0) {
              try {
                var data = JSON.parse(line.slice(6));
                if (data.type === 'progress') {
                  checked = data.index;
                  if (data.result === 'success') {
                    liveCount++;
                    addRow('live', data.entry);
                    addLog('LIVE', data.entry.user + ' -> LIVE | ' + data.entry.url + ' | ' + data.entry.time + 'ms');
                  } else {
                    deadCount++;
                    addRow('dead', data.entry);
                    addLog('DEAD', data.entry.user + ' -> DEAD | ' + (data.entry.error || data.entry.url) + ' | ' + data.entry.time + 'ms');
                  }
                  updateStats();
                } else if (data.type === 'done') {
                  addLog('INFO', 'Done: ' + data.successCount + ' live, ' + data.deadCount + ' dead');
                  finishCheck();
                }
              } catch(e) {}
            }
          }
        }
        finishCheck();
      }).catch(function() { finishCheck(); });
    }

    function addRow(type, entry) {
      var list = document.getElementById(type === 'live' ? 'liveList' : 'deadList');
      var div = document.createElement('div');
      div.className = 'row ' + type;
      var html = '<span class="u">' + esc(entry.user) + '</span><span class="p">' + esc(entry.pass) + '</span><span class="px">' + esc(entry.proxy) + '</span><span class="t">' + (entry.time || 0) + 'ms</span>';
      if (type === 'dead' && entry.error) {
        html += '<div class="err">' + esc(entry.error.substring(0, 200)) + '</div>';
      }
      div.innerHTML = html;
      list.appendChild(div);
      list.scrollTop = list.scrollHeight;
    }

    function updateStats() {
      document.getElementById('statProg').textContent = checked + '/' + total;
      document.getElementById('statLive').textContent = 'Live: ' + liveCount;
      document.getElementById('statDead').textContent = 'Dead: ' + deadCount;
      document.getElementById('liveCount').textContent = liveCount;
      document.getElementById('deadCount').textContent = deadCount;
      document.getElementById('progressFill').style.width = total ? (checked / total * 100) + '%' : '0%';
    }

    function finishCheck() {
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').style.display = 'none';
      updateStats();
    }

    function stopCheck() {
      if (abortController) abortController.abort();
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').style.display = 'none';
      updateStats();
      addLog('INFO', 'Stopped by user');
    }

    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
